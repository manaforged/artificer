name: Cargo beta

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta:
    name: Test on Cargo beta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the beta toolchain
        run: rustup toolchain install beta --profile minimal --component clippy --no-self-update
      - name: Run the suite on beta
        run: cargo +beta test --all-targets --locked
