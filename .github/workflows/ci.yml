name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    if: github.repository == 'manaforged/artificer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting and Clippy
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo package --locked --target-dir "${CARGO_TARGET_DIR:-target}/package-check"
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        if: runner.os == 'Linux'
      - name: Run tests
        run: cargo test --all-targets --locked
      - name: Validate POSIX installer
        if: runner.os != 'Windows'
        shell: sh
        run: sh -n scripts/install.sh && ./scripts/install.sh --help
      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1 -Help
