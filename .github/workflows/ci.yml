name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Run tests
        run: cargo test --all-targets --locked
      - name: Validate POSIX installer
        if: runner.os != 'Windows'
        shell: sh
        run: sh -n scripts/install.sh && ./scripts/install.sh --help
      - name: Install, build a fixture through the shim, and uninstall
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          unset CARGO_TARGET_DIR CARGO_BUILD_TARGET_DIR
          real_cargo=$(command -v cargo)
          rustup_home=$(rustup show home)
          toolchain=$(rustup show active-toolchain | cut -d' ' -f1)
          scratch=$(mktemp -d -p "${RUNNER_TEMP:-$HOME}")
          export HOME="$scratch/home" CARGO_HOME="$scratch/cargo" RUSTUP_HOME="$rustup_home" RUSTUP_TOOLCHAIN="$toolchain" ARTIFICER_HOME="$scratch/store"
          mkdir -p "$HOME" "$CARGO_HOME/bin"
          ARTIFICER_REAL_CARGO="$real_cargo" ./scripts/install.sh
          . "$HOME/.artificer/env"
          shim=$(command -v cargo)
          test "$shim" = "$HOME/.artificer/bin/cargo"
          "$shim" new --lib "$scratch/fixture"
          "$shim" build --manifest-path "$scratch/fixture/Cargo.toml"
          test -d "$ARTIFICER_HOME/units"
          ./scripts/install.sh --uninstall
          test ! -e "$CARGO_HOME/bin/artificer"
          test ! -e "$HOME/.artificer/bin/cargo"
      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1 -Help

  lint:
    name: Rust formatting and lints
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Package the crate
        run: cargo package --locked --target-dir "${CARGO_TARGET_DIR:-target}/package-check"

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  required:
    name: required
    needs: [test, lint, dependencies]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every check passed or was not needed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
