[book]
title = "Artificer"
description = "User guide and reference for Artificer, a compile cache for Rust that every checkout on a machine shares"
src = "."
authors = ["Manaforge Technologies, LLC"]
language = "en"

[build]
build-dir = "../target/book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/manaforged/artificer"
edit-url-template = "https://github.com/manaforged/artificer/edit/main/docs/{path}"
default-theme = "light"
preferred-dark-theme = "navy"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
use-boolean-and = true
